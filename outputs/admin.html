<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Admin</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#102a3a;--bg:#f5f8f7;--line:#dbe7e4;--muted:#66808a;--mint:#70dfb8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Manrope,Arial}header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(22px,calc((100vw - 1160px)/2));display:flex;justify-content:space-between;align-items:center}main{max-width:1160px;margin:auto;padding:28px 22px}.hidden{display:none}.ey,label,.section h3{color:var(--muted);font-size:10px;letter-spacing:1.3px;font-weight:800;text-transform:uppercase}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin:18px 0}.toolbar{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff}.toolbar select{flex:1}.map{height:240px;background:radial-gradient(ellipse at 32% 54%,#c2ddc0 0 11%,transparent 12%),radial-gradient(ellipse at 70% 33%,#d5e7c9 0 14%,transparent 15%),linear-gradient(105deg,#d7e9d5,#e9f0e4);border-radius:10px;position:relative;cursor:crosshair}.route{position:absolute;left:12%;top:18%;height:54%;width:75%;border:3px dashed #226574;border-left:0;border-bottom:0;border-radius:0 135px 0 0;transform:rotate(-18deg)}#pin{position:absolute;width:35px;height:35px;background:var(--ink);border:4px solid #fff;border-radius:50% 50% 50% 0;transform:translate(-50%,-50%) rotate(-45deg);touch-action:none;box-shadow:0 4px 12px #123a4866}#pin:after{content:"";position:absolute;inset:8px;background:var(--mint);border-radius:50%}.section{padding:20px 0;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section h3{margin:0 0 14px}.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field.wide{grid-column:span 2}label{display:block;margin-bottom:6px}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;font:12px Manrope;color:var(--ink);background:#fcfdfc}button{border:0;border-radius:7px;background:var(--ink);color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}.toolbar button{background:var(--mint);color:var(--ink)}button:disabled{opacity:.6;cursor:wait}.save{margin-top:20px}@media(max-width:700px){main{padding:20px 14px}.forms{grid-template-columns:1fr}.field.wide{grid-column:auto}.toolbar{align-items:stretch;flex-wrap:wrap}.toolbar select{flex:auto;width:100%}}</style></head><body><header><b>northstar logistics · admin portal</b><button id="logout">Sign out</button></header><main><div id="loading">Checking secure access…</div><div id="denied" class="hidden">You are not authorised as an admin.</div><section id="app" class="hidden"><div class="ey">Shipment administration</div><h1>Manage shipment details</h1><div class="card toolbar"><b>ACTIVE SHIPMENT</b><select id="picker"></select><button id="newBtn" type="button">+ New shipment</button></div><div class="card"><h3>Live map location</h3><p>Drag the pin to set the customer-facing map position.</p><div class="map" id="map"><div class="route"></div><div id="pin"></div></div></div><form id="form" class="card"><h2>Enter Shipment Details</h2><div id="sections"></div><button class="save">Publish shipment changes</button></form></section></main><script type="module">import{supabase,role}from'./supabase.js';const D={'Shipment Key':'NST-847292','Shipment ID':'','Sender Name':'','Sender Address':'','Sender Email':'','Receiver Name':'','Receiver Address':'','Receiver Email':'','Proforma Invoice No':'','Invoice Date':'','Due Date':'','Currency':'USD','Payment Method':'','Payment Mode':'','Ship To (Attention)':'','ETA':'','Freight Method':'','Delivery Type':'','Origin Facility':'Lagos, Nigeria','Delivery Destination':'Abidjan, Côte d’Ivoire','Description':'','Unit(s)':'','Unit Price':'','Shipping':'','Total Payable':'','Amount in Words':'','Status':'In transit','Location':'','Message':'','Map X':'50','Map Y':'50'};const groups={'Shipment Details':['Shipment Key','Shipment ID'],'Sender Information':['Sender Name','Sender Address','Sender Email'],'Receiver Information':['Receiver Name','Receiver Address','Receiver Email'],'Invoice Details':['Proforma Invoice No','Invoice Date','Due Date','Currency','Payment Method','Payment Mode'],'Shipping Details':['Ship To (Attention)','ETA','Freight Method','Delivery Type','Origin Facility','Delivery Destination'],'Item Details':['Description','Unit(s)','Unit Price','Shipping','Total Payable','Amount in Words'],'Status Updates':['Status','Location','Message','Map X','Map Y']};const wide=['Sender Address','Receiver Address','Description','Amount in Words','Message'],place={'Shipment ID':'Enter Shipment ID (e.g. 29164040)','Invoice Date':'mm/dd/yyyy','Due Date':'mm/dd/yyyy'};const $=id=>document.getElementById(id),form=$('form'),pin=$('pin'),map=$('map'),picker=$('picker'),sections=$('sections');let all=[],cur={...D},drag=false;function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}function set(x,y){x=Number(x)||50;y=Number(y)||50;pin.style.left=x+'%';pin.style.top=y+'%';if(form.elements['Map X']){form.elements['Map X'].value=Math.round(x);form.elements['Map Y'].value=Math.round(y)}}function control(k,v){if(k==='Status')return `<select name="Status">${['In transit','At customs','Out for delivery','Delivered'].map(s=>`<option ${s===v?'selected':''}>${s}</option>`).join('')}</select>`;return `<input name="${k}" value="${esc(v)}" placeholder="${place[k]||''}">`}function render(){picker.innerHTML=all.map(s=>`<option ${s['Shipment Key']===cur['Shipment Key']?'selected':''}>${esc(s['Shipment Key'])}</option>`).join('');sections.innerHTML=Object.entries(groups).map(([title,keys])=>`<section class="section"><h3>${title}</h3><div class="forms">${keys.map(k=>`<div class="field ${wide.includes(k)?'wide':''}"><label>${k}</label>${control(k,cur[k])}</div>`).join('')}</div></section>`).join('');set(cur['Map X'],cur['Map Y'])}async function load(selected){const{data,error}=await supabase.rpc('list_shipments');if(error)throw error;all=data||[];cur={...D,...(all.find(s=>s['Shipment Key']===(selected||cur['Shipment Key']))||all[0]||{})};render()}supabase.auth.onAuthStateChange(async(_,session)=>{if(!session){window.location.href='login.html';return}$('loading').classList.add('hidden');if(!['admin','superadmin'].includes(await role())){$('denied').classList.remove('hidden');return}$('app').classList.remove('hidden');try{await load()}catch(e){alert(e.message)}});$('logout').onclick=()=>supabase.auth.signOut();$('newBtn').onclick=()=>{const key=prompt('New shipment key');if(key){cur={...D,'Shipment Key':key};render()}};picker.onchange=e=>{cur={...D,...all.find(s=>s['Shipment Key']===e.target.value)};render()};pin.onpointerdown=e=>{drag=true;pin.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(!drag)return;const r=map.getBoundingClientRect();set(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)))};map.onpointerup=()=>drag=false;form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const button=form.querySelector('.save');button.disabled=true;button.textContent='Publishing…';let result=await supabase.rpc('save_shipment',{p_data:data});if(!result.error)result=await supabase.rpc('update_route_endpoints',{p_key:data['Shipment Key'],p_origin:data['Origin Facility'],p_destination:data['Delivery Destination']});if(result.error){alert('Could not publish: '+result.error.message)}else{const verify=await supabase.rpc('get_public_tracking',{p_key:data['Shipment Key']});const saved=Array.isArray(verify.data)?verify.data[0]:verify.data;if(!saved||saved['Location']!==data['Location'])alert('Database did not retain the new location. Run fix-admin-publish.sql in Supabase, then publish again.');else{alert('Shipment published. Your new location is saved.');await load(data['Shipment Key'])}}button.disabled=false;button.textContent='Publish shipment changes'};</script></body></html>
