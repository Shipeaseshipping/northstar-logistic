<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar Admin</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--n:#102a3a;--p:#f6f8f6;--l:#dfe9e7;--u:#6a818a;--m:#7ce4bd}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--n);font:14px Manrope,Arial}header,main{max-width:1160px;margin:auto;padding:22px}header{max-width:none;background:#fff;display:flex;justify-content:space-between;border-bottom:1px solid var(--l)}.hidden{display:none}.ey{font-size:10px;letter-spacing:1.6px;font-weight:800;color:var(--u)}.card{background:white;border:1px solid var(--l);border-radius:13px;padding:22px;margin:17px 0}.bar{background:var(--n);color:#fff;display:flex;align-items:center;gap:12px}.bar select{flex:1}.map{height:245px;background:radial-gradient(ellipse at 34% 55%,#c2ddc0 0 11%,transparent 12%),linear-gradient(105deg,#d7e9d5,#e9f0e4);border-radius:9px;position:relative;cursor:crosshair}.route{position:absolute;left:12%;top:18%;height:54%;width:75%;border:3px dashed #226574;border-left:0;border-bottom:0;border-radius:0 135px 0 0;transform:rotate(-18deg)}#pin{position:absolute;width:35px;height:35px;background:var(--n);border:4px solid white;border-radius:50% 50% 50% 0;transform:translate(-50%,-50%) rotate(-45deg);touch-action:none;box-shadow:0 4px 12px #123a4866}#pin:after{content:"";position:absolute;inset:8px;background:var(--m);border-radius:50%}.section{padding:21px 0;border-bottom:1px solid var(--l)}.section:last-child{border:0}.section h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#466b77;margin:0 0 14px}.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field.wide{grid-column:span 2}.field label{display:block;font-size:10px;font-weight:800;color:var(--u);margin-bottom:6px}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #dce8e5;border-radius:6px;font:12px Manrope;color:var(--n);background:#fcfdfc}button{border:0;border-radius:6px;background:var(--n);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}.bar button{background:var(--m);color:var(--n)}.save{margin-top:19px}@media(max-width:700px){.forms{grid-template-columns:1fr}.field.wide{grid-column:auto}.bar{align-items:stretch;flex-wrap:wrap}.bar select{width:100%;flex:auto}}</style></head><body><header><b>northstar logistics · admin portal</b><button id="logout">Sign out</button></header><main><div id="loading">Checking secure access…</div><div id="denied" class="hidden">You are not authorised as an admin.</div><section id="app" class="hidden"><div class="ey">SHIPMENT ADMINISTRATION</div><h1>Manage shipment details</h1><div class="card bar"><b>ACTIVE SHIPMENT</b><select id="picker"></select><button id="newBtn" type="button">+ New shipment</button></div><div class="card"><h3>Live map location</h3><p>Drag the pin to show the exact customer location.</p><div class="map" id="map"><div class="route"></div><div id="pin"></div></div></div><form id="form" class="card"><h2>Enter Shipment Details</h2><div id="sections"></div><button class="save">Publish shipment changes</button></form></section></main><script type="module">import{supabase,role}from'./supabase.js';const D={'Shipment Key':'NST-847292','Shipment ID':'','Sender Name':'','Sender Address':'','Sender Email':'','Receiver Name':'','Receiver Address':'','Receiver Email':'','Proforma Invoice No':'','Invoice Date':'','Due Date':'','Currency':'USD','Payment Method':'','Payment Mode':'','Ship To (Attention)':'','ETA':'','Freight Method':'','Delivery Type':'','Description':'','Unit(s)':'','Unit Price':'','Shipping':'','Total Payable':'','Amount in Words':'','Status':'In transit','Location':'','Message':'','Map X':'50','Map Y':'50'};const groups={'Shipment Details':['Shipment Key','Shipment ID'],'Sender Information':['Sender Name','Sender Address','Sender Email'],'Receiver Information':['Receiver Name','Receiver Address','Receiver Email'],'Invoice Details':['Proforma Invoice No','Invoice Date','Due Date','Currency','Payment Method','Payment Mode'],'Shipping Details':['Ship To (Attention)','ETA','Freight Method','Delivery Type'],'Item Details':['Description','Unit(s)','Unit Price','Shipping','Total Payable','Amount in Words'],'Status Updates':['Status','Location','Message','Map X','Map Y']};const wide=['Sender Address','Receiver Address','Description','Amount in Words','Message'],place={'Shipment ID':'Enter Shipment ID (e.g. 29164040)','Invoice Date':'mm/dd/yyyy','Due Date':'mm/dd/yyyy'};const $=x=>document.getElementById(x);let all=[],cur={...D},drag=false;function set(x,y){pin.style.left=x+'%';pin.style.top=y+'%';if(form.elements['Map X']){form.elements['Map X'].value=Math.round(x);form.elements['Map Y'].value=Math.round(y)}}function control(k,v){if(k==='Status')return `<select name="Status">${['In transit','At customs','Out for delivery','Delivered'].map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;return `<input name="${k}" value="${String(v||'').replaceAll('"','&quot;')}" placeholder="${place[k]||''}">`}function render(){picker.innerHTML=all.map(x=>`<option ${x['Shipment Key']===cur['Shipment Key']?'selected':''}>${x['Shipment Key']}</option>`).join('');sections.innerHTML=Object.entries(groups).map(([title,keys])=>`<section class="section"><h3>${title}</h3><div class="forms">${keys.map(k=>`<div class="field ${wide.includes(k)?'wide':''}"><label>${k}:</label>${control(k,cur[k])}</div>`).join('')}</div></section>`).join('');set(cur['Map X'],cur['Map Y'])}async function load(){let{data,error}=await supabase.rpc('list_shipments');if(error)throw error;all=data||[];cur={...D,...(all[0]||{})};render()}supabase.auth.onAuthStateChange(async(_,s)=>{if(!s){location='login.html';return}loading.classList.add('hidden');if(!['admin','superadmin'].includes(await role())){denied.classList.remove('hidden');return}app.classList.remove('hidden');load()});logout.onclick=()=>supabase.auth.signOut();newBtn.onclick=()=>{let k=prompt('New shipment key');if(k){cur={...D,'Shipment Key':k};render()}};picker.onchange=e=>{cur={...D,...all.find(x=>x['Shipment Key']===e.target.value)};render()};pin.onpointerdown=e=>{drag=true;pin.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(drag){let r=map.getBoundingClientRect();set(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100)))}};map.onpointerup=()=>drag=false;form.onsubmit=async e=>{e.preventDefault();let{error}=await supabase.rpc('save_shipment',{p_data:Object.fromEntries(new FormData(form))});if(error)alert(error.message);else{alert('Shipment published');load()}};</script></body></html>
