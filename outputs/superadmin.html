<!doctype html><meta charset="utf-8"><title>Northstar Superadmin</title><style>body{font:14px Arial;background:#f4f8f7;color:#102a3a;max-width:1050px;margin:30px auto;padding:20px}.hidden{display:none}.card{background:white;padding:20px;border-radius:12px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #dce8e5;text-align:left}button,select{padding:8px;border-radius:5px;border:1px solid #dce8e5}</style><p><a href="admin.html">Admin</a> · <button id="logout">Sign out</button></p><div id="loading">Checking superadmin authorisation…</div><main id="app" class="hidden"><h1>Security & activity centre</h1><div class="card"><h2>Administrators</h2><table id="admins"></table></div><div class="card"><h2>Promote existing account</h2><select id="users"></select><button id="promote">Make admin</button></div><div class="card"><h2>Recent activity</h2><table id="logs"></table></div></main><p id="denied" class="hidden">Superadmin access required.</p><script type="module">import{supabase,role}from'./supabase.js';const $=x=>document.getElementById(x);async function load(){let{data,error}=await supabase.rpc('superadmin_data');if(error)return alert(error.message);admins.innerHTML='<tr><th>Email</th><th>Role</th></tr>'+data.admins.map(x=>`<tr><td>${x.email}</td><td>${x.role}</td></tr>`).join('');users.innerHTML=data.users.map(x=>`<option value="${x.id}">${x.email} (${x.role})</option>`).join('');logs.innerHTML='<tr><th>Time</th><th>Activity</th><th>Admin</th><th>Key</th></tr>'+data.activity.map(x=>`<tr><td>${x.created_at}</td><td>${x.type}</td><td>${x.actor_email||''}</td><td>${x.shipment_key||''}</td></tr>`).join('')}supabase.auth.onAuthStateChange(async(_,s)=>{if(!s){location='login.html';return}loading.classList.add('hidden');if(await role()!=='superadmin'){denied.classList.remove('hidden');return}app.classList.remove('hidden');load()});logout.onclick=()=>supabase.auth.signOut();promote.onclick=async()=>{let{error}=await supabase.rpc('set_user_role',{p_id:users.value,p_role:'admin'});if(error)alert(error.message);else load()};</script>
