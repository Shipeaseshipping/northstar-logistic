<!doctype html><meta charset="utf-8"><title>Northstar Admin Login</title><style>body{font:16px Arial;background:#f4f8f7;display:grid;place-items:center;min-height:90vh}.box{width:320px;background:white;padding:28px;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #dce8e5;border-radius:6px}button{background:#102a3a;color:white}</style><form class="box" id="form"><h1>Admin sign in</h1><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button><p id="error"></p></form><script type="module">import{supabase}from'./supabase.js';form.onsubmit=async e=>{e.preventDefault();let{error:e2}=await supabase.auth.signInWithPassword({email:email.value,password:password.value});if(e2)error.textContent='Sign-in failed.';else location='admin.html'}</script>
